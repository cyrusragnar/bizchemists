<VirtualHost *:80>
  DocumentRoot /var/www/html

  <Directory /var/www/html>
    # No directory listings, no .htaccess overrides, no symlink escapes.
    Options -Indexes -Includes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
  </Directory>

  # Deliberately no SPA catch-all. Every route the app can reach is written to disk as
  # a real file (/, /work/<slug>/index.html), and a fallback would shadow those pages
  # with the homepage while turning every typo into a soft 404.

  # ---------------------------------------------------------------- security
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "DENY"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()"
  Header always set Cross-Origin-Opener-Policy "same-origin"
  # Set by the proxy in front of this container once HTTPS is terminated there.
  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

  # Google Fonts is the only third party. Inline styles are required: React sets
  # element styles directly and the pre-hydration fallback ships a <style> block.
  Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

  # Dotfiles are never content.
  <FilesMatch "^\.">
    Require all denied
  </FilesMatch>

  # Only the contact endpoint is PHP; nothing else in the tree should ever execute.
  <FilesMatch "\.php$">
    Require all denied
  </FilesMatch>
  <Files "contact.php">
    Require all granted
  </Files>

  # ---------------------------------------------------------------- caching
  <IfModule mod_expires.c>
    ExpiresActive On
    # Hashed filenames, so these can never go stale.
    <LocationMatch "^/assets/">
      Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    ExpiresByType image/jpeg "access plus 30 days"
    ExpiresByType image/png "access plus 30 days"
    ExpiresByType video/mp4 "access plus 30 days"
  </IfModule>

  # HTML must revalidate or a deploy never reaches anyone.
  <FilesMatch "\.html$">
    Header always set Cache-Control "public, max-age=0, must-revalidate"
  </FilesMatch>

  <IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml application/javascript application/json image/svg+xml
  </IfModule>

  ErrorLog /dev/stderr
  CustomLog /dev/stdout combined
</VirtualHost>
