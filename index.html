<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />

    <title>The BizChemists — Creative Marketing &amp; Branding Agency in Bangladesh</title>
    <meta
      name="description"
      content="Gen Z focused, youth-led creative marketing and branding agency in Bangladesh. Brand strategy, content, web and growth campaigns. 50+ projects, 20+ clients."
    />
    <link rel="canonical" href="__SITE__/" />
    <meta name="author" content="The BizChemists" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The BizChemists" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="__SITE__/" />
    <meta property="og:title" content="The BizChemists — Creative Marketing &amp; Branding Agency in Bangladesh" />
    <meta
      property="og:description"
      content="A Gen Z focused, youth-led creative marketing and branding agency in Bangladesh. Brand strategy, content, web and growth campaigns."
    />
    <meta property="og:image" content="__SITE__/brand/hero.jpg" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1350" />
    <meta property="og:image:alt" content="The BizChemists poster: Where Brands Are Formulated." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The BizChemists — Creative Marketing &amp; Branding Agency in Bangladesh" />
    <meta
      name="twitter:description"
      content="A Gen Z focused, youth-led creative marketing and branding agency in Bangladesh."
    />
    <meta name="twitter:image" content="__SITE__/brand/hero.jpg" />

    <!--
      logo.png is the full lockup: the mark sits in the middle third of a 500x500
      canvas that is 91% transparent, with chevrons out at the corners. As a favicon
      that renders about six pixels of logo, and the white "b" disappears entirely on
      a pale tab strip. These are cropped to the mark and set on an ink disc, matching
      the round window the nav already uses.
    -->
    <!-- Google requires a square whose side is a multiple of 48, and checks
         /favicon.ico at the domain root before it reads any of these. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/brand/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The poster is the LCP element on every viewport; start it before the CSS resolves. -->
    <link rel="preload" as="image" href="/brand/hero-start.jpg" fetchpriority="high" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!--
      Generated at build time from src/content.js by build/seo.mjs, so the structured
      data cannot drift out of sync with the copy on the page.
    -->
    <!--seo:jsonld-->

    <!--
      Styling for the pre-React markup below. It is the page a crawler without
      JavaScript reads, and the page a visitor without JavaScript gets to use.
      React replaces it on mount.
    -->
    <style>
      #seo-fallback {
        background: #0a0a0a;
        color: #e9e9e9;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        line-height: 1.6;
        margin: 0;
        padding: 8vh 6vw;
      }
      #seo-fallback h1 {
        font-size: clamp(2rem, 7vw, 4.5rem);
        line-height: 0.95;
        letter-spacing: -0.03em;
        text-transform: uppercase;
        margin: 0.4em 0;
      }
      #seo-fallback h2 {
        font-size: clamp(1.5rem, 4vw, 2.75rem);
        letter-spacing: -0.02em;
        text-transform: uppercase;
        margin: 2.5em 0 0.6em;
      }
      #seo-fallback h3 { font-size: 1.1rem; margin: 1.6em 0 0.3em; }
      #seo-fallback p, #seo-fallback li, #seo-fallback dd { max-width: 68ch; }
      #seo-fallback .eyebrow {
        color: #c6ff4d;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }
      #seo-fallback .lede { font-size: 1.05rem; color: #cfcfcf; }
      #seo-fallback a { color: #c6ff4d; }
      #seo-fallback .cta { font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; }
      #seo-fallback dt { font-weight: 600; margin-top: 1.4em; }
      #seo-fallback dd { margin: 0.3em 0 0; color: #cfcfcf; }
      #seo-fallback ul, #seo-fallback ol { color: #cfcfcf; }
    </style>
  </head>
  <body>
    <div id="root"><!--seo:content--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
